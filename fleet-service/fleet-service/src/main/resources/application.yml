server:
  port: ${PORT:8082}

spring:
  application:
    name: fleet-service

  datasource:
    url: jdbc:postgresql://postgres-db:5432/fleet_db
    username: sayantanB2B
    password: 12345
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: redis-cache
      port: 6379

  cache:
    type: simple

  management:
    endpoints:
      web:
        exposure:
          include: health,info,metrics
    endpoint:
      health:
        show-details: always

eureka:
  client:
    service-url:
      defaultZone: http://service-registry:8761/eureka/
  instance:
    prefer-ip-address: true
