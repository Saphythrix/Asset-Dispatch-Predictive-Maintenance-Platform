version: '3.8'

networks:
  asset-network:
    driver: bridge

services:
  # ==========================================
  # 1. DATABASE & CACHING INFRASTRUCTURE
  # ==========================================
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sayantanB2B
      POSTGRES_PASSWORD: 12345
    ports:
      - "5432:5432"
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sayantanB2B"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - asset-network

  redis-cache:
    image: redis:7-alpine
    container_name: redis-cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - asset-network

  # ==========================================
  # 2. SERVICE DISCOVERY & GATEWAY
  # ==========================================
  service-registry:
    build: ./service-registry/service-registry
    container_name: service-registry
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8761
      - EUREKA_CLIENT_REGISTER_WITH_EUREKA=false
      - EUREKA_CLIENT_FETCH_REGISTRY=false
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - asset-network

  api-gateway:
    build: ./api-gateway/api-gateway
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      service-registry:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
    networks:
      - asset-network

  # ==========================================
  # 3. CORE DOMAIN MICROSERVICES
  # ==========================================
  auth-service:
    build: ./auth-service/auth-service
    container_name: auth-service
    restart: unless-stopped
    depends_on:
      postgres-db:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/auth_db
      - SPRING_DATASOURCE_USERNAME=sayantanB2B
      - SPRING_DATASOURCE_PASSWORD=12345
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
    networks:
      - asset-network

  fleet-service:
    build: ./fleet-service/fleet-service
    container_name: fleet-service
    restart: unless-stopped
    depends_on:
      postgres-db:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      redis-cache:
        condition: service_started
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/fleet_db
      - SPRING_DATASOURCE_USERNAME=sayantanB2B
      - SPRING_DATASOURCE_PASSWORD=12345
      - SPRING_DATA_REDIS_HOST=redis-cache
      - SPRING_DATA_REDIS_PORT=6379
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
    networks:
      - asset-network

  booking-service:
    build: ./booking-service/booking-service
    container_name: booking-service
    restart: unless-stopped
    depends_on:
      postgres-db:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      fleet-service:
        condition: service_started
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/booking_db
      - SPRING_DATASOURCE_USERNAME=sayantanB2B
      - SPRING_DATASOURCE_PASSWORD=12345
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
    networks:
      - asset-network

  maintenance-service:
    build: ./maintenance-service/maintenance-service
    container_name: maintenance-service
    restart: unless-stopped
    depends_on:
      postgres-db:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/workorder_db
      - SPRING_DATASOURCE_USERNAME=sayantanB2B
      - SPRING_DATASOURCE_PASSWORD=12345
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
    networks:
      - asset-network
